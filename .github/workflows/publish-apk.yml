name: Publish staged APK
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-apk
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify staged release APK
        run: |
          base64 --decode .release/railon-1.5.4-35.apk.b64 > "$RUNNER_TEMP/railon.apk"
          echo '7667d905c9693ef6822836fb1b2d6346ffad513ab4136ae0afa8ed1b7d515710  '"$RUNNER_TEMP/railon.apk" | sha256sum --check
      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.5.4-35 >/dev/null 2>&1 || gh release create v1.5.4-35 --draft --title '레일온 1.5.4 (35)' --notes-file .release/notes.md
          gh release upload v1.5.4-35 "$RUNNER_TEMP/railon.apk" --clobber
          gh release edit v1.5.4-35 --draft=false --latest --title '레일온 1.5.4 (35)' --notes-file .release/notes.md
      - name: Update app manifest
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          current = json.loads(Path('latest.json').read_text())
          if current['versionCode'] > 35:
              raise SystemExit('A newer release already exists; refusing to downgrade')
          latest = {
              'versionCode': 35,
              'versionName': '1.5.4',
              'apk': 'https://github.com/gyhun32-cell/railon-release/releases/download/v1.5.4-35/railon.apk',
              'notes': '전체 알람·상단 카드 디자인 개선 · 프리텐다드 한글 글꼴 · 유리 느낌의 캡슐 버튼과 부드러운 눌림 효과',
              'publishedAt': datetime.now(timezone.utc).isoformat(),
          }
          Path('latest.json').write_text(json.dumps(latest, ensure_ascii=False, indent=2) + '\n')
          PY
          git config user.name 'railon-bot'
          git config user.email 'railon-bot@users.noreply.github.com'
          git add latest.json
          git diff --cached --quiet || git commit -m 'release: 레일온 1.5.4 (35) 업데이트 배포'
          git push
